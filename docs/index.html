<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <meta name="description" content="RGMCE Teacher Attendance System" />
  <title>RGMCE Teacher Attendance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <img src="Images/Logo.png" alt="RGMCE Logo" class="site-logo" onerror="this.style.display='none'" />
    <h1>Rajiv Gandhi Memorial College of Education</h1>
    <p class="subtitle">Teacher Attendance System &middot; Kathua</p>
  </header>

  <main>
    <section id="view-loading" class="card">
      <p class="center" id="loading-text">Loading&hellip;</p>
    </section>

    <section id="view-id" class="card hidden">
      <h2>Teacher Login</h2>
      <p class="hint">Please enter your Teacher ID to continue</p>
      <form id="id-form" autocomplete="off">
        <input
          id="teacher-id-input"
          type="text"
          inputmode="text"
          autocapitalize="characters"
          autocomplete="off"
          spellcheck="false"
          required
          placeholder="e.g. T001"
        />
        <button type="submit" id="id-submit" class="btn btn-primary">Continue</button>
      </form>
    </section>

    <section id="view-confirm" class="card hidden">
      <h2>Confirm Identity</h2>
      <div class="confirm-box">
        <p class="confirm-name" id="confirm-name"></p>
      </div>
      <button id="confirm-yes" class="btn btn-primary">Confirm & Continue</button>
      <button id="confirm-no" class="btn btn-secondary">Change ID</button>
    </section>

    <section id="view-home" class="card hidden">
      <div class="home-head">
        <p class="home-name" id="home-name"></p>
        <p class="home-meta"><span id="home-date"></span></p>
      </div>

      <div class="status-card" id="status-card">
        <p class="status-label">Attendance Status</p>
        <p class="status-value" id="status-value">&mdash;</p>
        <dl class="status-grid">
          <div>
            <dt>Check-in Time</dt>
            <dd id="arrival-time">&mdash;</dd>
          </div>
          <div>
            <dt>Check-out Time</dt>
            <dd id="departure-time">&mdash;</dd>
          </div>
        </dl>
      </div>

      <button id="btn-arrival" class="btn btn-arrival">CHECK IN</button>
      <button id="btn-departure" class="btn btn-departure">CHECK OUT</button>
      <button id="btn-leave" class="btn btn-secondary">MARK LEAVE</button>

      <button id="btn-change" class="btn-link">Change Teacher ID</button>
    </section>

    <section id="view-error" class="card hidden">
      <h2>Something went wrong</h2>
      <p class="hint" id="error-text"></p>
      <button id="btn-retry" class="btn btn-primary">Try again</button>
    </section>
  </main>

  <div id="message" class="message hidden" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <p id="security-note"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
